<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch / home indicator; we pad with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PocketDeck</title>
    <meta name="description" content="Your own music, offline." />

    <!-- Standalone web-app mode (legacy Apple tag + standard tag) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PocketDeck" />
    <!-- Content runs edge-to-edge under a transparent status bar with light text -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png" sizes="180x180" />
    <!-- manifest.webmanifest <link> is injected by vite-plugin-pwa at build time -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
